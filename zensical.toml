[project]
site_url = "https://swissbiobanking.github.io/Train-the-Trainer_Kit/"
site_name = "Biobank Assessment Training Kit"
copyright = "© Swiss Biobanking Platform (SBP)"
site_description = "Training kit for new SBP evaluators: how to assess biobanks for the SBP NORMA and SBP OPTIMA Labels"
site_author = "Valeria Di Cola"

repo_url = "https://github.com/SwissBiobanking/Train-the-Trainer_Kit"
repo_name = "SwissBiobanking/Train-the-Trainer_Kit"

nav = [
  { "Overview" = "index.md" },
  { "Learning objectives" = "objectives.md" },
  { "Training curriculum" = [
    { "Module 1 — Understanding the SBP Labels" = "modules/module-1.md" },
    { "Module 2 — SQAN training" = "modules/module-2.md" },
    { "Module 3 — Compliance review techniques & tools" = "modules/module-3.md" },
    { "Module 4 — Practical case studies" = "modules/module-4.md" },
    { "Module 5 — Professional conduct & review rules" = "modules/module-5.md" },
  ] },
  { "Starter kit" = "starter-kit.md" },
  { "Step-by-step guideline" = "guideline.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

logo = "assets/images/logo-header.png"
favicon = "assets/images/favicon.png"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
